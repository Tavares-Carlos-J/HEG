<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>História Econômica Geral — Painel de Estudos</title>
  <style>
    :root {
      --bg-base: #0f141c;
      --surface-card: #161d28;
      --surface-sidebar: rgba(15, 20, 28, 0.92);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.1);

      /* Cores Taxonômicas */
      --color-theme: #334155;
      --glow-theme: rgba(148, 163, 184, 0.22);

      --color-pro: #2563eb;
      --glow-pro: rgba(37, 99, 235, 0.28);

      --color-contra: #dc2626;
      --glow-contra: rgba(220, 38, 38, 0.28);

      --color-neutral: #d97706;
      --glow-neutral: rgba(217, 119, 6, 0.28);

      --sidebar-width: 300px;
      --transition-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.6s ease;
      display: flex;
      flex-direction: column;
    }

    /* Gradientes Dinâmicos por Era/Tema */
    body.era-bg-1 { background: radial-gradient(circle at 80% 20%, #1e293b 0%, #0f172a 100%); }
    body.era-bg-2 { background: radial-gradient(circle at 80% 20%, #292018 0%, #110d0a 100%); }
    body.era-bg-3 { background: radial-gradient(circle at 80% 20%, #172536 0%, #0b131e 100%); }
    body.era-bg-4 { background: radial-gradient(circle at 80% 20%, #23272e 0%, #0d1014 100%); }
    body.era-bg-5 { background: radial-gradient(circle at 80% 20%, #2c161b 0%, #12090c 100%); }
    body.era-bg-6 { background: radial-gradient(circle at 80% 20%, #2a1215 0%, #0f080a 100%); }
    body.era-bg-7 { background: radial-gradient(circle at 80% 20%, #132833 0%, #091318 100%); }
    body.era-bg-8 { background: radial-gradient(circle at 80% 20%, #152238 0%, #090f1a 100%); }
    body.era-bg-9 { background: radial-gradient(circle at 80% 20%, #2e1818 0%, #140b0b 100%); }
    body.era-bg-10 { background: radial-gradient(circle at 80% 20%, #1a2626 0%, #0b1111 100%); }

    /* Splash Screen Inicial */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #1e293b 0%, #090d14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.55s ease, transform 0.55s ease, visibility 0.55s;
    }

    #splash-screen.splash-hidden {
      opacity: 0;
      transform: scale(1.06);
      visibility: hidden;
      pointer-events: none;
    }

    .splash-box {
      max-width: 520px;
      width: 100%;
      background: rgba(22, 29, 40, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
    }

    .splash-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .splash-question {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .btn-start {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2.2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.55);
    }

    /* Estrutura Principal */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Sidebar Lateral */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface-sidebar);
      border-right: 1px solid var(--border-subtle);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      overflow-y: auto;
      transition: transform var(--transition-smooth), opacity var(--transition-smooth);
    }

    .sidebar-header {
      padding: 1.25rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .btn-close-sidebar {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .sidebar-nav {
      padding: 1rem 0.85rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .nav-part-block {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .nav-part-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #60a5fa;
      font-weight: 700;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background var(--transition-fast);
    }

    .nav-part-title:hover {
      background: rgba(96, 165, 250, 0.12);
    }

    .nav-theme-btn {
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      font-size: 0.83rem;
      line-height: 1.35;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .nav-theme-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-theme-btn.active {
      color: #ffffff;
      background: rgba(37, 99, 235, 0.18);
      border-color: rgba(37, 99, 235, 0.45);
      font-weight: 600;
    }

    .nav-theme-period {
      display: block;
      font-size: 0.7rem;
      opacity: 0.65;
      margin-top: 0.15rem;
    }

    /* Palco de Estudo */
    .stage-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      transition: margin-left var(--transition-smooth);
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .btn-menu-mobile {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .hierarchy-breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .crumb-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .crumb-pill:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .crumb-sep {
      color: var(--text-muted);
      user-select: none;
    }

    .legend-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .legend-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .legend-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-theme::before { background: #64748b; }
    .dot-pro::before { background: var(--color-pro); }
    .dot-contra::before { background: var(--color-contra); }
    .dot-neutral::before { background: var(--color-neutral); }

    /* Área Central do Card */
    .card-arena {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
      position: relative;
    }

    .study-card {
      width: 100%;
      max-width: 780px;
      min-height: 360px;
      background: var(--surface-card);
      border-radius: 20px;
      padding: 3rem 2.75rem;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
      border: 2px solid var(--color-theme);
      box-shadow: 0 20px 50px var(--glow-theme);
      user-select: none;
    }

    .study-card:hover {
      transform: translateY(-3px);
    }

    /* Classes Taxonômicas Obrigatórias */
    .study-card.card-theme {
      border-color: #475569;
      box-shadow: 0 20px 55px var(--glow-theme);
      background: linear-gradient(160deg, #1b222d 0%, #11161f 100%);
    }

    .study-card.card-pro {
      border-color: var(--color-pro);
      box-shadow: 0 20px 55px var(--glow-pro);
    }

    .study-card.card-contra {
      border-color: var(--color-contra);
      box-shadow: 0 20px 55px var(--glow-contra);
    }

    .study-card.card-neutral {
      border-color: var(--color-neutral);
      box-shadow: 0 20px 55px var(--glow-neutral);
    }

    .card-badge {
      position: absolute;
      top: 1.35rem;
      right: 1.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
    }

    /* Estado 1: Visão Foco */
    .card-focus-view {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
    }

    .focus-title {
      font-size: clamp(1.65rem, 3.6vw, 2.6rem);
      font-weight: 800;
      line-height: 1.22;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .focus-period {
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .focus-hint {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: rgba(148, 163, 184, 0.65);
    }

    /* Estado 2: Modo Explicação (Substituição Total) */
    .card-explanation-view {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      text-align: left;
      user-select: text;
    }

    .explanation-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }

    .explanation-kicker {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .explanation-title {
      font-size: clamp(1.3rem, 2.5vw, 1.75rem);
      font-weight: 700;
      color: #ffffff;
    }

    .explanation-body {
      font-size: 1.04rem;
      line-height: 1.72;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .explanation-body strong {
      color: #ffffff;
      font-weight: 700;
    }

    .explanation-body ul {
      padding-left: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .explanation-footer-hint {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* Comportamento de Ocultação Auxiliar no Estado 2 */
    body.explanation-active .study-card .card-focus-view {
      display: none;
    }

    body.explanation-active .study-card .card-explanation-view {
      display: flex;
    }

    body.explanation-active .top-bar,
    body.explanation-active .bottom-controls,
    body.explanation-active .sidebar {
      opacity: 0;
      pointer-events: none;
    }

    body.explanation-active .stage-wrapper {
      margin-left: 0;
    }

    body.explanation-active .study-card {
      max-width: 860px;
    }

    /* Controles Inferiores */
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      transition: opacity var(--transition-fast);
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .btn-nav:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .progress-indicator {
      font-size: 0.84rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Responsividade Mobile */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .btn-close-sidebar {
        display: inline-block;
      }

      .stage-wrapper {
        margin-left: 0;
        padding: 1rem 1.15rem;
      }

      .btn-menu-mobile {
        display: inline-flex;
      }

      .legend-bar {
        display: none;
      }

      .study-card {
        padding: 2.2rem 1.5rem;
        min-height: 300px;
      }
    }
  </style>
</head>
<body class="era-bg-1">

  <!-- 1. Splash Screen Inicial -->
  <div id="splash-screen" role="dialog" aria-modal="true">
    <div class="splash-box">
      <span class="splash-tag">História Econômica Geral</span>
      <h1 class="splash-question">Pronto para decifrar a história econômica?</h1>
      <button id="btn-start-journey" class="btn-start" type="button">
        Iniciar Jornada
      </button>
    </div>
  </div>

  <!-- 2. Palco Principal -->
  <div class="app-shell">
    <!-- Sidebar Lateral -->
    <aside id="sidebar" class="sidebar" aria-label="Menu de Temas Históricos">
      <div class="sidebar-header">
        <span class="sidebar-brand">Eixos Históricos</span>
        <button id="btn-close-sidebar" class="btn-close-sidebar" aria-label="Fechar menu">✕</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <!-- Palco Central -->
    <main class="stage-wrapper">
      <!-- Topo Hierárquico -->
      <header class="top-bar">
        <div class="hierarchy-breadcrumbs">
          <button id="btn-open-sidebar" class="btn-menu-mobile" type="button">☰ Temas</button>
          <button id="crumb-part" class="crumb-pill" type="button" title="Ver Panorama da Parte"></button>
          <span class="crumb-sep">›</span>
          <button id="crumb-theme" class="crumb-pill" type="button" title="Ver Panorama do Tema"></button>
        </div>
        <div class="legend-bar" aria-hidden="true">
          <span class="legend-dot dot-theme">Tema</span>
          <span class="legend-dot dot-pro">Expansão</span>
          <span class="legend-dot dot-contra">Crise</span>
          <span class="legend-dot dot-neutral">Conceito</span>
        </div>
      </header>

      <!-- Card Central Protagonista -->
      <section class="card-arena">
        <article id="study-card" class="study-card card-theme" tabindex="0" role="button" aria-expanded="false">
          <span id="card-badge" class="card-badge">Panorama</span>

          <!-- Estado 1: Foco -->
          <div class="card-focus-view">
            <h2 id="focus-title" class="focus-title"></h2>
            <p id="focus-period" class="focus-period"></p>
            <span class="focus-hint">Clique no card para abrir a explicação detalhada</span>
          </div>

          <!-- Estado 2: Explicação -->
          <div class="card-explanation-view">
            <div class="explanation-header">
              <div id="explanation-kicker" class="explanation-kicker"></div>
              <h2 id="explanation-title" class="explanation-title"></h2>
            </div>
            <div id="explanation-body" class="explanation-body"></div>
            <div class="explanation-footer-hint">
              Clique no card ou pressione <strong>Esc</strong> para retornar ao modo foco
            </div>
          </div>
        </article>
      </section>

      <!-- Controles Inferiores -->
      <footer class="bottom-controls">
        <button id="btn-prev" class="btn-nav" type="button">← Anterior</button>
        <div id="progress-indicator" class="progress-indicator"></div>
        <button id="btn-next" class="btn-nav" type="button">Próximo →</button>
      </footer>
    </main>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. CONSTANTE DE DADOS ESTRUTURADOS (DATABASE)
     * Hierarquia: Parte -> Tema -> Item -> Explicação
     * ============================================================================
     */
    const DATABASE = [
      {
        id: "parte-1",
        titulo: "Parte 1: A formação do capitalismo",
        periodo: "Pré-história – 1918",
        panorama: `
          <p><strong>Panorama Geral da Parte 1:</strong> Esta macrofase acompanha a longa trajetória de formação e consolidação do modo de produção capitalista, partindo das sociedades pré-mercados até a eclosão da Primeira Guerra Mundial.</p>
          <ul>
            <li><strong>Eixos analíticos:</strong> transição das economias baseadas na reciprocidade e redistribuição para a hegemonia dos mercados autorreguláveis.</li>
            <li><strong>Transformações estruturais:</strong> acumulação primitiva de capital, sistema colonial mercantilista, Revolução Industrial Britânica e expansão imperialista financeira.</li>
          </ul>
        `,
        temas: [
          {
            id: "tema-1",
            numero: 1,
            titulo: "1. História econômica: a economia no tempo e no espaço",
            periodo: "Eixo Metodológico",
            bgClass: "era-bg-1",
            classeTema: "card-theme",
            panorama: `
              <p>A <strong>História Econômica Geral (HEG)</strong> constitui a disciplina acadêmica voltada à compreensão das transformações das sociedades no tempo e no espaço sob a ótica da satisfação de suas necessidades materiais. Estruturada formalmente de modo tardio em relação à Economia e à História, a disciplina emergiu a partir da necessidade de resgatar a <strong>historicidade concreta</strong> dos fenômenos sociais contra o método dedutivo e anti-histórico da teoria convencional dominante. Ao fazê-lo, a HEG evidencia que sistemas de produção, técnicas e instituições não representam dados naturais ou perenes da condição humana, mas sim construções sociais dinâmicas e historicamente situadas.</p>
              <p>A análise do processo econômico desdobra-se na confluência de duas dimensões fundamentais: o <strong>tempo</strong> e o <strong>espaço</strong>. O tempo histórico afasta-se da mera sucessão cronológica linear e quantitativa para apreender continuidades, conjunturas e rupturas qualitativas nas estruturas materiais da sociedade. Por sua vez, o espaço econômico deixa de ser um receptáculo geográfico inerte para configurar o território ativamente produzido pelas redes de troca, fluxos de recursos, hierarquias de poder e pela divisão territorial do trabalho. Investigar a economia no tempo e no espaço implica, desse modo, recusar leis abstratas universais e demonstrar como cada sociedade molda formas específicas e irrepetíveis de produzir e reproduzir a sua existência material.</p>
            `,
            itens: [
              {
                titulo: "1. Tradição Materialista-Histórica",
                ano: "Karl Marx e Friedrich Engels",
                classe: "card-neutral",
                explicacao: `
                  <p>Formulada originariamente por <strong>Karl Marx</strong> e <strong>Friedrich Engels</strong>, a tradição materialista-histórica estabelece que a <strong>produção material da vida imediata</strong> constitui a base real e o fundamento sobre o qual repousa toda a evolução jurídica, política, intelectual e social da humanidade. Essa perspectiva afasta as concepções idealistas da história ao colocar os indivíduos de carne e osso, suas condições empíricas de subsistência e seu metabolismo prático com a natureza mediado pelo trabalho no centro de qualquer análise social rigorosa.</p>
                  <p>Nesse arcabouço, a dinâmica das sociedades é examinada a partir da articulação interna de seus <strong>modos de produção</strong>, definidos pelo desenvolvimento combinado de suas forças produtivas materiais e de suas relações sociais de produção. A evolução histórica não decorre da realização passiva de ideias metafísicas, mas da contradição insolúvel que emerge quando tais relações de propriedade se convertem em entraves às forças técnicas e humanas existentes, abrindo épocas de revolução e impulsionando a <strong>luta de classes</strong> como o vetor concreto das grandes transformações estruturais.</p>
                `
              },
              {
                titulo: "2. Vertente Neoclássica e Institucional",
                ano: "John Hicks e Douglass North",

                  <p>A perda de rentabilidade manufatureira do centro capitalista e as crises de superprodução encontraram nas encomendas militares do Estado a via prioritária para garantir a valorização do capital[cite: 11]. A estreita simbiose entre os altos escalões dos governos da OTAN e os conglomerados bélicos transnacionais (como Lockheed Martin, Boeing, RTX e Rheinmetall) atua como determinante estrutural da beligerância contemporânea[cite: 11].</p>
                  <p>A ampliação orçamentária dos gastos bélicos mundiais para além de 2,4 trilhões de dólares anuais, a formação do pacto trilateral de submarinos nucleares AUKUS entre EUA, Reino Unido e Austrália, e o envio ininterrupto de dezenas de bilhões de dólares em armas para cenários de guerra ativa no Leste Europeu e no Oriente Médio funcionam como choques de demanda artificial que alimentam a lucratividade das grandes corporações[cite: 11]. Como demonstrado no debate sobre o desenvolvimento do capitalismo, a militarização contínua constitui uma irracionalidade destrutiva que ameaça a sobrevivência humana e drena recursos vitais que poderiam reverter catástrofes sociais e ecológicas[cite: 11].</p>
                `
              },
              {
                titulo: "17° A Crise Moral da Ordem Baseada em Regras e a Deslegitimação das Instituições Multilaterais",
                ano: "2023 – 2026",
                classe: "card-contra",
                explicacao: `

                  <p>Os vetos sucessivos dos Estados Unidos no Conselho de Segurança da ONU, somados aos ataques políticos e ameaças de sanções contra juízes e procuradores da Corte Internacional de Justiça (CIJ) e do Tribunal Penal Internacional (TPI) quando estes apontaram crimes de guerra israelenses, expuseram o colapso moral da chamada "ordem internacional baseada em regras"[cite: 11]. Esse descalabro gerou uma revolta ética generalizada em todo o Sul Global, cristalizada na ação judicial histórica aberta pela África do Sul em Haia, desmantelando de maneira irreversível qualquer pretensão ocidental de autoridade moral sobre as nações periféricas[cite: 11].</p>

              },
              {
                titulo: "18° O \"Novo Não Alinhamento\" e a Rebelião Diplomática do Sul Global",

                explicacao: `
                  <p>As pressões coercitivas exercidas pelo bloco ocidental para que os países do antigo Terceiro Mundo rompessem laços econômicos com a Rússia e a China colidiram com uma nova postura de soberania e dignidade política entre os países em desenvolvimento[cite: 11]. Esse fenômeno — qualificado formalmente no <em>Diplomatic Bluebook</em> do governo japonês e nos relatórios de grandes instituições financeiras ocidentais como um "novo estado de espírito" do Sul Global — expressa o fato de que a esmagadora maioria dos 145 países que compõem o G77 recusou-se a acatar as diretrizes isolacionistas de Washington e Bruxelas[cite: 11].</p>
                  <p>Respaldados pelo peso econômico de parceiros alternativos na Eurásia, esses governos perceberam que o mercado norte-americano não atua mais como comprador de última instância indispensável e que aceitar o alinhamento cego à OTAN significaria comprometer seus próprios planos de segurança alimentar e energética[cite: 11]. Esse novo não alinhamento pragmático e despolarizado não visa construir um império rival, mas estabelecer redes soberanas de integração regional, cooperação tecnológica e intercâmbio comercial, minando a estrutura unilateral construída desde a queda da União Soviética[cite: 11].</p>
                `
              },
              {
                titulo: "19° O Diagnóstico do Sistema em 2026: A Transição Hegemônica Incompleta e a Encruzilhada Civilizatória",
                ano: "Horizonte 2026",
                classe: "card-neutral",
                explicacao: `
                  <p>Ao alcançar o limiar de 2026, a geoeconomia política mundial encontra-se no centro de uma clássica crise sistêmica de transição de hegemonia, onde o velho arranjo hegemônico unipolar anglo-saxão já não consegue impor sua vontade nem arbitrar as disputas globais, enquanto a nova ordem multipolar ainda enfrenta o risco agudo do revanchismo bélico ocidental[cite: 11]. A economia-mundo capitalista opera hoje formalmente bifurcada: de um lado, o núcleo atlantista (G7-OTAN), munido de poderio militar devastador, controle das tecnologias de vigilância e plataformas midiáticas, mas estagnado produtivamente e consumido pelo endividamento; de outro, a maioria global do Sul e do Leste, que reúne o polo dinâmico da manufatura, os grandes volumes populacionais e as principais reservas de matérias-primas e energia[cite: 11].</p>
                  <p>As consequências dessa bifurcação colocam a humanidade diante de uma encruzilhada estrutural: ou as potências ocidentais aceitam o equilíbrio de forças, a desmilitarização de seus complexos industriais e a coexistência pacífica dentro de uma governança multinível cooperativa, ou arrastarão a periferia para uma espiral de caos social, conflitos armamentistas ampliados e catástrofes climáticas irreversíveis causadas pela irracionalidade inerente à reprodução do capital[cite: 11].</p>
                `
              }
            ]
          }
        ]
      }
    ];

    /**
     * ============================================================================
     * 2. LÓGICA DE CICLO DE VIDA, ESTADO E MANIPULAÇÃO DO DOM
     * ============================================================================
     */
    const AppState = {
      partIndex: 0,
      themeIndex: 0,
      itemIndex: 0,
      viewType: "item", // 'item' | 'part-panorama' | 'theme-panorama'
      isExplanationOpen: false
    };

    const DOM = {
      body: document.body,
      splashScreen: document.getElementById("splash-screen"),
      btnStartJourney: document.getElementById("btn-start-journey"),
      sidebar: document.getElementById("sidebar"),
      sidebarNav: document.getElementById("sidebar-nav"),
      btnOpenSidebar: document.getElementById("btn-open-sidebar"),
      btnCloseSidebar: document.getElementById("btn-close-sidebar"),
      crumbPart: document.getElementById("crumb-part"),
      crumbTheme: document.getElementById("crumb-theme"),
      studyCard: document.getElementById("study-card"),
      cardBadge: document.getElementById("card-badge"),
      focusTitle: document.getElementById("focus-title"),
      focusPeriod: document.getElementById("focus-period"),
      explanationKicker: document.getElementById("explanation-kicker"),
      explanationTitle: document.getElementById("explanation-title"),
      explanationBody: document.getElementById("explanation-body"),
      btnPrev: document.getElementById("btn-prev"),
      btnNext: document.getElementById("btn-next"),
      progressIndicator: document.getElementById("progress-indicator")
    };

    const TAXONOMY_LABELS = {
      "card-theme": "Panorama / Eixo",
      "card-pro": "Expansão / Consolidação",
      "card-contra": "Crise / Choque",
      "card-neutral": "Conceito / Instituição"
    };

    function getCurrentPart() {
      return DATABASE[AppState.partIndex];
    }

    function getCurrentTheme() {
      return getCurrentPart().temas[AppState.themeIndex];
    }

    function getCurrentItem() {
      return getCurrentTheme().itens[AppState.itemIndex];
    }

    /* Renderiza a barra lateral com as 2 Partes e os 10 Temas */
    function buildSidebar() {
      DOM.sidebarNav.innerHTML = "";

      DATABASE.forEach((parte, pIdx) => {
        const partBlock = document.createElement("div");
        partBlock.className = "nav-part-block";

        const partHeader = document.createElement("div");
        partHeader.className = "nav-part-title";
        partHeader.textContent = parte.titulo;
        partHeader.title = "Clique para abrir o Panorama Geral desta Parte";
        partHeader.addEventListener("click", () => {
          AppState.partIndex = pIdx;
          AppState.themeIndex = 0;
          AppState.itemIndex = 0;
          AppState.viewType = "part-panorama";
          setExplanationState(false);
          closeMobileSidebar();
          renderStage();
        });

        partBlock.appendChild(partHeader);

        parte.temas.forEach((tema, tIdx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-theme-btn";
          btn.dataset.part = pIdx;
          btn.dataset.theme = tIdx;
          btn.innerHTML = `
            <span>${tema.titulo}</span>
            <span class="nav-theme-period">${tema.periodo}</span>
          `;

          btn.addEventListener("click", () => {
            AppState.partIndex = pIdx;
            AppState.themeIndex = tIdx;
            AppState.itemIndex = 0;
            AppState.viewType = "item";
            setExplanationState(false);
            closeMobileSidebar();
            renderStage();
          });

          partBlock.appendChild(btn);
        });

        DOM.sidebarNav.appendChild(partBlock);
      });
    }

    function updateSidebarHighlight() {
      const buttons = DOM.sidebarNav.querySelectorAll(".nav-theme-btn");
      buttons.forEach((btn) => {
        const isCurrent =
          Number(btn.dataset.part) === AppState.partIndex &&
          Number(btn.dataset.theme) === AppState.themeIndex;
        btn.classList.toggle("active", isCurrent);
      });
    }

    function updateDynamicBackground(bgClass) {
      for (let i = 1; i <= 10; i++) {
        DOM.body.classList.remove(`era-bg-${i}`);
      }
      DOM.body.classList.add(bgClass || "era-bg-1");
    }

    function applyCardTaxonomy(taxClass) {
      DOM.studyCard.classList.remove("card-theme", "card-pro", "card-contra", "card-neutral");
      const validClass = TAXONOMY_LABELS[taxClass] ? taxClass : "card-theme";
      DOM.studyCard.classList.add(validClass);
      DOM.cardBadge.textContent = TAXONOMY_LABELS[validClass];
    }

    function setExplanationState(open) {
      AppState.isExplanationOpen = open;
      DOM.body.classList.toggle("explanation-active", open);
      DOM.studyCard.setAttribute("aria-expanded", String(open));
    }

    /* Renderiza o palco principal conforme o estado atual */
    function renderStage() {
      const parte = getCurrentPart();
      const tema = getCurrentTheme();

      DOM.crumbPart.textContent = parte.titulo;
      DOM.crumbTheme.textContent = tema.titulo;

      updateSidebarHighlight();
      updateDynamicBackground(tema.bgClass);

      if (AppState.viewType === "part-panorama") {
        applyCardTaxonomy("card-theme");
        DOM.focusTitle.textContent = parte.titulo;
        DOM.focusPeriod.textContent = `Panorama Geral da Parte (${parte.periodo})`;
        DOM.explanationKicker.textContent = `Macrofase • ${parte.periodo}`;
        DOM.explanationTitle.textContent = parte.titulo;
        DOM.explanationBody.innerHTML = parte.panorama;
        DOM.progressIndicator.textContent = "Visualizando Panorama da Parte";
      } else if (AppState.viewType === "theme-panorama") {
        applyCardTaxonomy(tema.classeTema || "card-theme");
        DOM.focusTitle.textContent = tema.titulo;
        DOM.focusPeriod.textContent = `Panorama do Tema (${tema.periodo})`;
        DOM.explanationKicker.textContent = `${parte.titulo} • ${tema.periodo}`;
        DOM.explanationTitle.textContent = tema.titulo;
        DOM.explanationBody.innerHTML = tema.panorama;
        DOM.progressIndicator.textContent = "Visualizando Panorama do Tema";
      } else {
        const item = getCurrentItem();
        applyCardTaxonomy(item.classe);
        DOM.focusTitle.textContent = item.titulo;
        DOM.focusPeriod.textContent = item.ano;
        DOM.explanationKicker.textContent = `${tema.titulo} • ${item.ano}`;
        DOM.explanationTitle.textContent = item.titulo;
        DOM.explanationBody.innerHTML = item.explicacao;
        DOM.progressIndicator.textContent = `Item ${AppState.itemIndex + 1} de ${tema.itens.length} neste Tema`;
      }

      updateNavigationButtons();
    }

    function isAtFirstGlobalItem() {
      return AppState.partIndex === 0 && AppState.themeIndex === 0 && AppState.itemIndex === 0 && AppState.viewType === "item";
    }

    function isAtLastGlobalItem() {
      const lastPartIdx = DATABASE.length - 1;
      const lastThemeIdx = DATABASE[lastPartIdx].temas.length - 1;
      const lastItemIdx = DATABASE[lastPartIdx].temas[lastThemeIdx].itens.length - 1;
      return (
        AppState.partIndex === lastPartIdx &&
        AppState.themeIndex === lastThemeIdx &&
        AppState.itemIndex === lastItemIdx &&
        AppState.viewType === "item"
      );
    }

    function updateNavigationButtons() {
      DOM.btnPrev.disabled = isAtFirstGlobalItem();
      DOM.btnNext.disabled = isAtLastGlobalItem();
    }

    function navigateNext() {
      setExplanationState(false);

      if (AppState.viewType !== "item") {
        AppState.viewType = "item";
        renderStage();
        return;
      }

      const parte = getCurrentPart();
      const tema = getCurrentTheme();

      if (AppState.itemIndex < tema.itens.length - 1) {
        AppState.itemIndex++;
      } else if (AppState.themeIndex < parte.temas.length - 1) {
        AppState.themeIndex++;
        AppState.itemIndex = 0;
      } else if (AppState.partIndex < DATABASE.length - 1) {
        AppState.partIndex++;
        AppState.themeIndex = 0;
        AppState.itemIndex = 0;
      }

      renderStage();
    }

    function navigatePrev() {
      setExplanationState(false);

      if (AppState.viewType !== "item") {
        AppState.viewType = "item";
        renderStage();
        return;
      }

      if (AppState.itemIndex > 0) {
        AppState.itemIndex--;
      } else if (AppState.themeIndex > 0) {
        AppState.themeIndex--;
        AppState.itemIndex = getCurrentTheme().itens.length - 1;
      } else if (AppState.partIndex > 0) {
        AppState.partIndex--;
        AppState.themeIndex = getCurrentPart().temas.length - 1;
        AppState.itemIndex = getCurrentTheme().itens.length - 1;
      }

      renderStage();
    }

    function closeMobileSidebar() {
      DOM.sidebar.classList.remove("open");
    }

    /* Registro de Eventos */
    function bindEvents() {
      // Splash Screen desaparece suavemente e não retorna na sessão
      DOM.btnStartJourney.addEventListener("click", () => {
        DOM.splashScreen.classList.add("splash-hidden");
      });

      // Alternância entre Estado 1 (Foco) e Estado 2 (Explicação)
      DOM.studyCard.addEventListener("click", () => {
        setExplanationState(!AppState.isExplanationOpen);
      });

      // Clique nos indicadores superiores (Panorama da Parte e Panorama do Tema)
      DOM.crumbPart.addEventListener("click", () => {
        AppState.viewType = "part-panorama";
        setExplanationState(true);
        renderStage();
      });

      DOM.crumbTheme.addEventListener("click", () => {
        AppState.viewType = "theme-panorama";
        setExplanationState(true);
        renderStage();
      });

      // Botões de navegação inferior
      DOM.btnNext.addEventListener("click", navigateNext);
      DOM.btnPrev.addEventListener("click", navigatePrev);

      // Menu retrátil em telas menores
      DOM.btnOpenSidebar.addEventListener("click", () => {
        DOM.sidebar.classList.add("open");
      });

      DOM.btnCloseSidebar.addEventListener("click", closeMobileSidebar);

      // Navegação por teclado (ArrowLeft, ArrowRight e Escape)
      window.addEventListener("keydown", (event) => {
        if (!DOM.splashScreen.classList.contains("splash-hidden")) {
          if (event.key === "Enter") {
            DOM.splashScreen.classList.add("splash-hidden");
          }
          return;
        }

        if (event.key === "Escape" && AppState.isExplanationOpen) {
          setExplanationState(false);
        } else if (event.key === "ArrowRight") {
          if (!DOM.btnNext.disabled) navigateNext();
        } else if (event.key === "ArrowLeft") {
          if (!DOM.btnPrev.disabled) navigatePrev();
        }
      });
    }

    /* Inicialização */
    buildSidebar();
    bindEvents();
    renderStage();
  </script>
</body>
</html>
